<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meny</title>

<style>
   
   main{
    padding: 0.5rem 2rem;
   }

   
   span{
    font-weight: bold;
   }
   

  header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: lightskyblue;
    color: darkslategray;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    padding: 0.5rem 2rem;
    border-radius: 10ex;
    font-size: large;
    border: 1px solid blue;
  }
  
   nav{}


   ul{
        display: flex;
        list-style: none;
        gap: 3rem;
    }


    body{
        background-color: lightblue;
        margin: 0;
        color: darkslategray;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    }

    .box{
        background: lightskyblue;
        border-radius: 1rem;
        box-shadow: 0 4px 24px rgb(8, 0, 69, 0.22);
        border: 1px solid blue;
        min-height: 1rem;
        display: inline-flex;
        padding: 1rem;
    }
</style>

</head>
<body>
    <header>
       <span>Semantiska element</span> 
       <nav>
        <ul>
            <li>Hem</li>
            <li>Grundläggande element</li>
            <li>Om oss</li>
            <li>Hjälp</li>
        </ul>
       </nav>
    </header>

    <main>
        <h1>Print("Hello World")</h1>
        <p class="box">Print("Hello World")</p>
        <h2>Print("Hello World")</h2>
        <p class="box">Print("Hello World")</p>
        <h3>Print("Hello World")</h3>
        <p class="box">Print("Hello World")</p>
        <h4>Print("Hello World")</h4>
        <p class="box">Print("Hello World")</p>
    </main>

    <footer>
    </footer>
    
</body>
</html>
